                <!-- <img src="https://land.withusmk.co.kr/assets/saju/resources/img/main-img/main_logoBox.webp" alt=""> -->

                    <div class="main_product_tit">

                        <div class="pd_box">
                            <img src="resources/img/main-img/pd01.webp" alt="">
                            <img src="resources/img/main-img/pd02.webp" alt="">

                            <img src="resources/img/main-img/pd04.webp" alt="">

                        <h1>난 어떤 운명을 타고났을까?</h1>
                        <img src="resources/img/main-img/saju.webp" alt="">

    <footer></footer>

    <section class="loadings_loadBox"></section>


    <section class="sticky_Bottom_Bar js_sticky_Bottom_Bar"> </section>


    <!-- 템플릿.js -->
    <script src="./resources/js/common.js"></script>

    <script>

        
        (function() {
            const video = document.getElementById('mainBgVideo');
            const img   = document.getElementById('mainBgImg');
            const loading = document.querySelector('.loadings_loadBox');
        
            if (sessionStorage.getItem('mainVideoPlayed')) {
                // 재방문 / 새로고침 / 페이지 이동 후 복귀
                if (video) video.style.display = 'none';
                if (img)   img.style.display   = 'block';
                if (loading) loading.remove(); // ← 로딩 섹션 제거
            } else {
                // 탭 첫 진입
                sessionStorage.setItem('mainVideoPlayed', 'true');
                // 로딩은 그대로 존재
            }
        })();

        

    </script>
</body>
